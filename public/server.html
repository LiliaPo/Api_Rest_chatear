<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Servidor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link href="/styles/style.css" rel="stylesheet">
    <style>
        /* Estilos generales */
        .container {
            padding: 15px;
            max-width: 100%;
        }

        /* Estilos de la tabla */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table td, .table th {
            white-space: nowrap;
            padding: 8px;
        }

        /* Estilos de los botones */
        .btn-action {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            margin: 2px;
            min-width: 35px;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        /* Estilos del formulario de edición */
        .edit-form {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            margin: 10px 0;
        }

        .edit-form .form-group {
            margin-bottom: 10px;
        }

        .edit-form input {
            max-width: 100%;
        }

        /* Media queries para diferentes tamaños de pantalla */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .card-header {
                flex-direction: column;
                gap: 10px;
            }

            .card-header h2 {
                font-size: 1.5rem;
                text-align: center;
            }

            .table td, .table th {
                font-size: 0.9rem;
            }

            .btn-action {
                padding: 0.2rem 0.4rem;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 576px) {
            .card-header h2 {
                font-size: 1.2rem;
            }

            .table td, .table th {
                font-size: 0.8rem;
                padding: 5px;
            }

            .action-buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-action {
                width: 100%;
                margin: 2px 0;
            }

            .edit-form {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <button onclick="window.location.href='index.html'" class="btn btn-secondary mb-3">
            <i class="bi bi-arrow-left"></i> Volver
        </button>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2>Panel del Servidor - Usuarios Registrados</h2>
                <button onclick="loadUsers()" class="btn btn-primary">
                    <i class="bi bi-arrow-clockwise"></i> Actualizar
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Email</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usersList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                
                document.getElementById('usersList').innerHTML = users.map(user => `
                    <tr id="row-${user.id}">
                        <td>${user.id}</td>
                        <td>${user.userName}</td>
                        <td>${user.name}</td>
                        <td>${user.first_surname}</td>
                        <td>${user.email}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-warning btn-action" onclick="editUser(${user.id})">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-danger btn-action" onclick="deleteUser(${user.id})">
                                    <i class="bi bi-trash"></i>
                                </button>
                                <button class="btn btn-info btn-action" onclick="sendMessage(${user.id})">
                                    <i class="bi bi-envelope"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function editUser(userId) {
            try {
                const response = await fetch(`/api/users/${userId}`);
                const user = await response.json();
                
                const row = document.getElementById(`row-${userId}`);
                row.innerHTML = `
                    <td>${user.id}</td>
                    <td>
                        <input class="form-control form-control-sm" type="text" name="userName" value="${user.userName}" required>
                    </td>
                    <td>
                        <input class="form-control form-control-sm" type="text" name="name" value="${user.name}" required>
                    </td>
                    <td>
                        <input class="form-control form-control-sm" type="text" name="first_surname" value="${user.first_surname}" required>
                    </td>
                    <td>
                        <input class="form-control form-control-sm" type="email" name="email" value="${user.email}" required>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-success btn-action" onclick="saveEdit(event, ${userId}, this.parentElement.parentElement.parentElement)">
                                <i class="bi bi-check-lg"></i>
                            </button>
                            <button class="btn btn-secondary btn-action" onclick="loadUsers()">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </td>
                `;
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar datos del usuario');
            }
        }

        async function saveEdit(event, userId, row) {
            event.preventDefault();
            const userData = {
                userName: row.querySelector('[name="userName"]').value,
                name: row.querySelector('[name="name"]').value,
                first_surname: row.querySelector('[name="first_surname"]').value,
                email: row.querySelector('[name="email"]').value
            };

            try {
                const response = await fetch(`/api/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    alert('Usuario actualizado correctamente');
                    loadUsers();
                } else {
                    const error = await response.json();
                    alert(error.message || 'Error al actualizar usuario');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al actualizar usuario');
            }
        }

        function sendMessage(userId) {
            window.location.href = `conversation.html?userId=${userId}`;
        }

        async function deleteUser(userId) {
            if (confirm('¿Estás seguro de que quieres eliminar este usuario?')) {
                try {
                    const response = await fetch(`/api/users/${userId}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        loadUsers();
                    } else {
                        const error = await response.json();
                        alert(error.message || 'Error al eliminar usuario');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error al eliminar usuario');
                }
            }
        }

        // Cargar usuarios al iniciar
        loadUsers();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
