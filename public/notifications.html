<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones - Sistema de Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles/common.css" rel="stylesheet">
    <style>
        .notification-form {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(184, 167, 224, 0.2);
            margin: 20px auto;
            max-width: 800px;
        }

        .user-select {
            background: rgba(248, 246, 255, 0.8);
            border: 1px solid rgba(184, 167, 224, 0.3);
            border-radius: 25px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .user-select .form-check {
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .user-select .form-check:hover {
            background: rgba(184, 167, 224, 0.1);
        }

        .user-select .form-check-input:checked + .form-check-label {
            color: var(--color-primary);
            font-weight: 500;
        }

        .message-area {
            min-height: 150px;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(248, 246, 255, 0.8);
            border: 1px solid rgba(184, 167, 224, 0.3);
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
            <div class="text-center mb-4">
                <h1 class="display-4">Enviar Notificación</h1>
                <div class="mb-4">
                    <i class="bi bi-bell" style="font-size: 4rem; color: var(--color-primary);"></i>
                </div>
            </div>

            <div class="notification-form">
                <form id="notificationForm" onsubmit="sendNotification(event)">
                    <div class="mb-4">
                        <h5 class="mb-3">Seleccionar Destinatarios</h5>
                        <div class="user-select" id="usersList">
                            <!-- Los usuarios se cargarán aquí -->
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="message" class="form-label">Mensaje</label>
                        <textarea class="form-control message-area" id="message" name="message" required></textarea>
                    </div>

                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-send me-2"></i>
                            Enviar Notificación
                        </button>
                        <a href="server.html" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-left me-2"></i>
                            Volver al Panel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                
                document.getElementById('usersList').innerHTML = users.map(user => `
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="${user.id}" id="user${user.id}">
                        <label class="form-check-label" for="user${user.id}">
                            ${user.userName} (${user.name} ${user.first_surname})
                        </label>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function sendNotification(event) {
            event.preventDefault();
            const selectedUsers = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
                .map(checkbox => parseInt(checkbox.value));
            const message = document.getElementById('message').value;

            if (selectedUsers.length === 0) {
                alert('Por favor, selecciona al menos un usuario');
                return;
            }

            try {
                const response = await fetch('/api/notifications', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userIds: selectedUsers,
                        message: message
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Notificación enviada correctamente');
                    document.getElementById('message').value = '';
                    document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                } else {
                    alert(result.message || 'Error al enviar notificación');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al enviar notificación');
            }
        }

        // Cargar usuarios al iniciar
        loadUsers();
    </script>
</body>
</html>
