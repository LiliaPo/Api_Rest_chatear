<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Sistema de Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles/common.css" rel="stylesheet">
</head>
<body>
    <div class="hero">
        <div class="content text-center">
            <h1 class="display-4">Bienvenido al Sistema de Chat</h1>
            <div class="form-container">
                <div class="mb-4">
                    <i class="bi bi-chat-dots" style="font-size: 4rem; color: var(--color-primary);"></i>
                </div>
                <p class="lead mb-4">Por favor, selecciona una opción para continuar</p>
                <div class="d-grid gap-3">
                    <a href="login.html" class="btn btn-primary btn-lg">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Iniciar Sesión
                    </a>
                    <a href="newUser.html" class="btn btn-outline-primary btn-lg">
                        <i class="bi bi-person-plus me-2"></i>
                        Registrarse
                    </a>
                    <hr class="my-4">
                    <a href="server.html" class="btn btn-accent btn-lg">
                        <i class="bi bi-hdd-rack me-2"></i>
                        Servidor
                    </a>
                    <a href="chat.html" class="btn btn-secondary btn-lg">
                        <i class="bi bi-chat-text me-2"></i>
                        Chat
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
