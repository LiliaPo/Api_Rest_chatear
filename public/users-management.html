<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles/common.css" rel="stylesheet">
    <style>
        .users-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .users-header {
            background: var(--color-primary);
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .users-table-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            overflow-x: auto;
        }

        .table {
            min-width: 600px;
            margin-bottom: 0;
        }

        .table th {
            background: var(--color-primary);
            color: white;
            font-weight: 500;
        }

        .table td, .table th {
            vertical-align: middle;
            padding: 12px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .users-header {
                text-align: center;
                flex-direction: column;
            }

            .users-header h2 {
                font-size: 1.5rem;
            }

            .btn-group {
                width: 100%;
                display: flex;
                justify-content: center;
            }

            .users-table-container {
                padding: 10px;
            }

            .table td, .table th {
                padding: 8px;
                font-size: 0.9rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .users-header h2 {
                font-size: 1.2rem;
            }

            .table td, .table th {
                padding: 6px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="users-container">
        <div class="users-header">
            <h2><i class="bi bi-people-fill me-2"></i>Gestión de Usuarios</h2>
            <div class="btn-group">
                <button onclick="location.href='chat.html'" class="btn btn-outline-light me-2">
                    <i class="bi bi-chat-dots me-2"></i>Ir al Chat
                </button>
                <button onclick="logout()" class="btn btn-outline-light">
                    <i class="bi bi-box-arrow-right me-2"></i>Salir
                </button>
            </div>
        </div>

        <div class="users-table-container">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Email</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Los usuarios se cargarán aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.userName}</td>
                        <td>${user.email}</td>
                        <td>
                            <span class="badge bg-${user.active ? 'success' : 'danger'}">
                                ${user.active ? 'Activo' : 'Inactivo'}
                            </span>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <button onclick="editUser(${user.id})" class="btn btn-sm btn-primary">
                                    <i class="bi bi-pencil me-1"></i>Editar
                                </button>
                                <button onclick="toggleUserStatus(${user.id})" class="btn btn-sm btn-${user.active ? 'warning' : 'success'}">
                                    <i class="bi bi-${user.active ? 'pause' : 'play'} me-1"></i>
                                    ${user.active ? 'Desactivar' : 'Activar'}
                                </button>
                                <button onclick="deleteUser(${user.id})" class="btn btn-sm btn-danger">
                                    <i class="bi bi-trash me-1"></i>Eliminar
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function editUser(userId) {
            try {
                const user = await fetch(`/api/users/${userId}`).then(r => r.json());
                const newUserName = prompt('Nuevo nombre de usuario:', user.userName);
                const newEmail = prompt('Nuevo email:', user.email);
                
                if (!newUserName || !newEmail) return;

                const response = await fetch(`/api/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userName: newUserName,
                        email: newEmail
                    })
                });

                if (response.ok) {
                    await loadUsers();
                    alert('Usuario actualizado correctamente');
                } else {
                    const error = await response.json();
                    alert(error.message || 'Error al actualizar usuario');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al actualizar usuario');
            }
        }

        async function deleteUser(userId) {
            if (!confirm('¿Estás seguro de que quieres eliminar este usuario?')) return;

            try {
                const response = await fetch(`/api/users/${userId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    await loadUsers();
                    alert('Usuario eliminado correctamente');
                } else {
                    const error = await response.json();
                    alert(error.message || 'Error al eliminar usuario');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al eliminar usuario');
            }
        }

        async function toggleUserStatus(userId) {
            try {
                const response = await fetch(`/api/users/${userId}/toggle-status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    await loadUsers();
                } else {
                    const error = await response.json();
                    alert(error.message || 'Error al actualizar el estado del usuario');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al actualizar el estado del usuario');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Cargar usuarios al iniciar
        loadUsers();
    </script>
</body>
</html>
