<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Sistema de Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles/common.css" rel="stylesheet">
    <style>
        .table-container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin: 20px;
            box-shadow: 0 0 20px rgba(184, 167, 224, 0.2);
        }

        .table {
            color: var(--color-dark);
        }

        .table thead {
            background: rgba(184, 167, 224, 0.2);
        }

        .table th {
            font-weight: 600;
            border-bottom: none;
        }

        .btn-action {
            width: 35px;
            height: 35px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 2px;
            border-radius: 50%;
        }

        .form-control-sm {
            border-radius: 15px;
            border: 1px solid rgba(184, 167, 224, 0.3);
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="display-5">Gestión de Usuarios</h1>
            <div>
                <button onclick="loadUsers()" class="btn btn-accent me-2">
                    <i class="bi bi-arrow-clockwise me-2"></i>
                    Actualizar
                </button>
                <a href="server.html" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-left me-2"></i>
                    Volver
                </a>
            </div>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="usersList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                
                document.getElementById('usersList').innerHTML = users.map(user => `
                    <tr id="row-${user.id}">
                        <td>${user.id}</td>
                        <td>${user.userName}</td>
                        <td>${user.name}</td>
                        <td>${user.first_surname}</td>
                        <td>${user.email}</td>
                        <td>
                            <button class="btn btn-accent btn-action" onclick="editUser(${user.id})" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-secondary btn-action" onclick="sendMessage(${user.id})" title="Enviar mensaje">
                                <i class="bi bi-envelope"></i>
                            </button>
                            <button class="btn btn-primary btn-action" onclick="deleteUser(${user.id})" title="Eliminar">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function editUser(userId) {
            const row = document.getElementById(`row-${userId}`);
            const cells = row.getElementsByTagName('td');
            
            // Guardar los valores actuales
            const currentValues = {
                userName: cells[1].textContent,
                name: cells[2].textContent,
                first_surname: cells[3].textContent,
                email: cells[4].textContent
            };

            // Reemplazar con inputs
            cells[1].innerHTML = `<input type="text" class="form-control form-control-sm" value="${currentValues.userName}">`;
            cells[2].innerHTML = `<input type="text" class="form-control form-control-sm" value="${currentValues.name}">`;
            cells[3].innerHTML = `<input type="text" class="form-control form-control-sm" value="${currentValues.first_surname}">`;
            cells[4].innerHTML = `<input type="email" class="form-control form-control-sm" value="${currentValues.email}">`;
            
            // Cambiar botones
            cells[5].innerHTML = `
                <button class="btn btn-accent btn-action" onclick="saveEdit(${userId})" title="Guardar">
                    <i class="bi bi-check"></i>
                </button>
                <button class="btn btn-secondary btn-action" onclick="cancelEdit(${userId}, ${JSON.stringify(currentValues)})" title="Cancelar">
                    <i class="bi bi-x"></i>
                </button>
            `;
        }

        async function saveEdit(userId) {
            const row = document.getElementById(`row-${userId}`);
            const inputs = row.getElementsByTagName('input');
            
            const userData = {
                userName: inputs[0].value,
                name: inputs[1].value,
                first_surname: inputs[2].value,
                email: inputs[3].value
            };

            try {
                const response = await fetch(`/api/users/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    loadUsers(); // Recargar la tabla
                } else {
                    const error = await response.json();
                    alert(error.message || 'Error al actualizar usuario');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al actualizar usuario');
            }
        }

        function cancelEdit(userId, originalValues) {
            const row = document.getElementById(`row-${userId}`);
            const cells = row.getElementsByTagName('td');
            
            cells[1].textContent = originalValues.userName;
            cells[2].textContent = originalValues.name;
            cells[3].textContent = originalValues.first_surname;
            cells[4].textContent = originalValues.email;
            
            // Restaurar botones originales
            cells[5].innerHTML = `
                <button class="btn btn-accent btn-action" onclick="editUser(${userId})" title="Editar">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-secondary btn-action" onclick="sendMessage(${userId})" title="Enviar mensaje">
                    <i class="bi bi-envelope"></i>
                </button>
                <button class="btn btn-primary btn-action" onclick="deleteUser(${userId})" title="Eliminar">
                    <i class="bi bi-trash"></i>
                </button>
            `;
        }

        async function deleteUser(userId) {
            if (!confirm('¿Estás seguro de que quieres eliminar este usuario?')) {
                return;
            }

            try {
                const response = await fetch(`/api/users/${userId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    const row = document.getElementById(`row-${userId}`);
                    row.remove();
                } else {
                    const error = await response.json();
                    alert(error.message || 'Error al eliminar usuario');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al eliminar usuario');
            }
        }

        async function sendMessage(userId) {
            const message = prompt('Escribe tu mensaje:');
            if (!message) return;

            try {
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender_id: 1, // ID del servidor
                        receiver_id: userId,
                        content: message
                    })
                });

                if (response.ok) {
                    alert('Mensaje enviado correctamente');
                } else {
                    const error = await response.json();
                    alert(error.message || 'Error al enviar mensaje');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al enviar mensaje');
            }
        }

        // Cargar usuarios al iniciar
        loadUsers();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
